name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build Release
        run: ./gradlew build --no-daemon --stacktrace
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1 || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG="- Initial release ${{ github.ref_name }}"
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..${{ github.ref_name }}" --no-merges)
          fi
          # Escape for GitHub Actions multi-line output
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "log=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Generate Release Timestamp (MSK)
        id: timestamp
        run: |
          TIMESTAMP=$(TZ='Europe/Moscow' date +'%d.%m.%Y %H:%M')
          echo "msk=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "update: ${{ steps.timestamp.outputs.msk }} (UTC +3:00)"
          body: |
            ## BlackOut ${{ github.ref_name }}

            **Released:** ${{ steps.timestamp.outputs.msk }} MSK (UTC +3:00)

            ### 📋 Changes
            ${{ steps.changelog.outputs.log }}

            ### 📦 Downloads
            - `${{ github.event.repository.name }}-${{ github.ref_name }}.jar` — compiled mod
            - `${{ github.event.repository.name }}-${{ github.ref_name }}.jar.asc` — GPG signature
            - `${{ github.event.repository.name }}-${{ github.ref_name }}-sources.jar` — sources
            - `${{ github.event.repository.name }}-${{ github.ref_name }}-sources.jar.asc` — sources GPG signature
          files: |
            build/libs/*.jar
            build/libs/*.jar.asc
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'pre') }}
          fail_on_unmatched_files: false
